# ============================================================
# GLoW cocoBrain — Configuration (Étape 1: COCO Vision+Text)
# Run 13 — Refonte alignée sur les papiers du lab
# ============================================================

seed: 42

# --- Dimensions ---
workspace_dim: 32         # <- était 64 (effective rank ~37/64, on compacte)
latent_dims:
  vision: 64              # <- était 128
  text: 64                # <- était 128

# --- Vision : features ResNet-50 pré-extraites ---
vision:
  feature_dim: 2048

# --- Text : embeddings E5-large-v2 pré-extraits ---
text:
  feature_dim: 1024       # E5-large-v2 output dim

# --- Projections ---
projection:
  hidden_dim: 256         # <- était 512
  num_layers: 6           # <- était 2 (le lab utilise 4-8)
  dropout: 0.1

# --- Losses ---
losses:
  contrastive:
    temperature: 0.1
    weight: 0.1           # <- était 1.0 (le lab utilise 0.05-0.1)
  translation:            # Ltr — through decoder (observation space)
    weight: 1.0           # <- était 0.1 (le lab utilise 1.0)
  demi_cycle:             # Ldcy — on latents (z space)
    weight: 1.0
  cycle:                  # Lcy — round-trip z_a → w → z_b → w → z_a
    weight: 1.0
  fusion:                 # Lfusion — weighted-sum + Tanh, alpha ~ Beta(5,5)
    weight: 1.0           # <- était 5.0 (le bottleneck 64-dim suffit)

# --- Training ---
training:
  pretrain_epochs: 20
  pretrain_lr: 3.0e-4

  align_epochs: 50
  align_lr: 5.0e-4

  batch_size: 1024
  weight_decay: 1.0e-5
  grad_clip: 1.0
  paired_fraction: 0.2   # 20% des données appariées pour Ltr et Lcont

  domain_pairs:
    - ["vision", "text"]

# --- Data ---
data:
  dataset: "coco"
  data_root: "data/coco"
  num_workers: 4

# --- Logging ---
logging:
  use_wandb: true
  project: "glow-cocoBrain"
  log_every: 50
