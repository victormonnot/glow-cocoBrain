# ============================================================
# GLoW cocoBrain — Configuration (Étape 1: COCO Vision+Text)
# ============================================================

seed: 42

# --- Dimensions ---
workspace_dim: 384
latent_dims:
  vision: 512
  text: 512

# --- Vision : features ResNet-50 pré-extraites ---
vision:
  feature_dim: 2048

# --- Text : COCO Captions ---
text:
  vocab_size: 10000
  embed_dim: 256
  max_seq_len: 32
  num_heads: 4
  num_layers: 2

# --- Projections ---
projection:
  hidden_dim: 512
  num_layers: 2
  dropout: 0.1

# --- Workspace ---
workspace:
  fusion: "attention"
  num_heads: 8
  num_layers: 2

# --- Losses ---
losses:
  contrastive:
    temperature: 0.07
    weight: 1.0
  translation:
    weight: 1.0
  cycle:
    weight: 1.0
  reconstruction:
    weight: 1.0

# --- Training ---
training:
  pretrain_epochs: 20
  pretrain_lr: 3.0e-4

  align_epochs: 50
  align_lr: 5.0e-4

  batch_size: 512
  weight_decay: 1.0e-5
  grad_clip: 1.0

  domain_pairs:
    - ["vision", "text"]

# --- Data ---
data:
  dataset: "coco"
  data_root: "data/coco"
  num_workers: 4

# --- Logging ---
logging:
  use_wandb: false
  project: "glow-cocoBrain"
  log_every: 50
  eval_every: 10
